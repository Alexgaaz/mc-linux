# mcshell.conf — configuration de MCShell (format shell : CLÉ="valeur")
# Copié dans /etc/mcshell.conf. Surcharge perso possible : ~/.config/mcshell/mcshell.conf

## Minecraft
MCSHELL_MC_VERSION="26.1.2"        # version exigée par Waylandcraft 2.1.x
MCSHELL_FABRIC_LOADER="0.19.5"     # Fabric Loader (Waylandcraft demande >= 0.19.5)
MCSHELL_INSTANCE="MCShell"         # nom de l'instance dans Prism Launcher
MCSHELL_WORLD="MCShell"            # monde ouvert automatiquement s'il existe ("" = écran titre)
MCSHELL_RAM_MB="auto"              # mémoire max du jeu en Mo, ou "auto" (6 Go dès 16 Go de RAM)
MCSHELL_GAME_BACKEND="auto"        # "auto" ou "x11" (force XWayland si souci d'affichage)
MCSHELL_GAME_LANG="fr_fr"          # langue du jeu au premier lancement
MCSHELL_PRISM_LANG="fr"            # langue de Prism Launcher

## Mods (identifiants Modrinth) — les optionnels absents pour la version visée sont ignorés
MCSHELL_MODS_REQUIRED="fabric-api waylandcraft"
MCSHELL_MODS_OPTIONAL="sodium lithium ferrite-core modmenu"
MCSHELL_MODS_CHANNEL="beta"        # canal le moins stable accepté : release, beta ou alpha

## Bureau
MCSHELL_KEYBOARD_LAYOUT="fr"       # disposition XKB (sway + fenêtres Waylandcraft)
MCSHELL_KEYBOARD_VARIANT=""
MCSHELL_KEYBOARD_OPTIONS=""
MCSHELL_CONSOLE_KEYMAP="fr-latin9" # clavier de la console texte
MCSHELL_REFRESH="max"              # "max" (fréquence max de l'écran), "default" ou "3440x1440@165Hz"
MCSHELL_ADAPTIVE_SYNC="on"         # FreeSync / VRR
MCSHELL_TERMINAL="alacritty"       # terminal des menus et des applis « Terminal=true »

## Installation et session live
MCSHELL_TIMEZONE="Europe/Paris"
MCSHELL_LOCALE="fr_FR.UTF-8"
MCSHELL_GRUB_THEME="on"            # thème GRUB Minegrub (téléchargé depuis GitHub à l'installation)
MCSHELL_LIVE_COW="4G"              # RAM pour les écritures de la session live (lu à la construction)
