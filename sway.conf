# MCShell — sway utilisé comme compositeur « kiosque » invisible.
# mcshell-session complète ce fichier à chaque démarrage (clavier, écran).
xwayland enable
default_border none
default_floating_border none
focus_follows_mouse no
mouse_warping none
focus_on_window_activation focus
output * bg #0b0b0b solid_color
input type:pointer accel_profile flat
input type:touchpad {
    tap enabled
    natural_scroll disabled
}

# Chaque fenêtre (Prism, Minecraft, menus) occupe tout l'écran
for_window [all] fullscreen enable

# Échappatoires, actives même si le jeu est figé
bindsym --to-code Ctrl+Alt+End kill
bindsym --to-code Ctrl+Alt+BackSpace exec /usr/local/bin/mcshell-exit tty

exec /usr/local/bin/mcshell-launch
